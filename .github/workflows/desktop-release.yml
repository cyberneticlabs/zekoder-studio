name: Desktop Release

# Zekoder desktop distribution. A pushed annotated version tag (vX.Y.Z or vX.Y.Z-beta.N) is the
# only trigger: no branch pushes, manual dispatch, or GitHub Release events start a build. The
# release process, credentials, recovery and rollback are owned by docs/release.md.
#
#   preflight       strict tag, source and provenance checks; detects an already published tag
#   release-notes   the only job that reads the private GitHub Release draft (contents: write)
#   build           five matrix targets; build + packaged smoke only, never publishes
#   publish         the only job with GCP OIDC (id-token: write) and no GitHub write access
#   finalize        makes the GitHub Release visible after the catalog lists the tag
#
# Rerun failed jobs to retry the same tag: the same commit is rebuilt only for failed rows, and
# the publisher reuses byte-identical objects already stored in GCS.
on:
  push:
    tags:
      - "v*"

# One run per tag, never canceled. Different tags publish concurrently on purpose: the catalog
# update is a generation-guarded compare-and-swap that merges with whatever is already there, so
# serializing across tags (where GitHub keeps only one pending run) could drop a queued tag.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.repository == 'cyberneticlabs/zekoder-studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      version: ${{ steps.preflight.outputs.version }}
      channel: ${{ steps.preflight.outputs.channel }}
      builder_channel: ${{ steps.preflight.outputs.builder_channel }}
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      published_at: ${{ steps.preflight.outputs.published_at }}
      already_published: ${{ steps.preflight.outputs.already_published }}
    steps:
      # The exact pushed tag commit, with full history for upstream provenance.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install release tooling dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --include-workspace-root --workspace=@getpaseo/protocol

      - name: Fetch the pushed tag object
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Check tag, source and provenance
        id: preflight
        env:
          ZEKODER_RELEASE_BUCKET: ${{ vars.ZEKODER_RELEASE_BUCKET }}
        run: node scripts/desktop-release/release-ci.mjs preflight --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

  release-notes:
    needs: [preflight]
    if: ${{ needs.preflight.outputs.already_published != 'true' }}
    # Reading a private draft needs contents: write. This job holds no cloud identity and
    # builds nothing; it hands validated notes to publish as an artifact.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install release tooling dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --include-workspace-root --workspace=@getpaseo/protocol

      - name: Capture the matching GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-release/release-ci.mjs fetch-notes --tag "${{ needs.preflight.outputs.tag }}" --repo "${{ github.repository }}" --output "$RUNNER_TEMP/release-notes"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release-notes
          path: ${{ runner.temp }}/release-notes
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build:
    needs: [preflight, release-notes]
    if: ${{ needs.preflight.outputs.already_published != 'true' }}
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            runner: macos-14
            builder_flags: --mac --arm64
            node_options: --max-old-space-size=4096
          - target: darwin-x64
            platform: darwin
            runner: macos-15-intel
            builder_flags: --mac --x64
            # Metro's jest workers OOM on the generated ws-outbound.aot.js validator, the last
            # module in the web bundle. The Intel runner needs the larger heap.
            node_options: --max-old-space-size=8192
          # Windows rows name their targets: electron-builder.yml lists both arches per target, and
          # config arches beat a bare --x64/--arm64, so each row would otherwise build both arches
          # plus a combined installer and write a latest.yml pointing at the wrong one.
          - target: win32-x64
            platform: win32
            runner: windows-latest
            builder_flags: --win nsis zip --x64
            node_options: ""
          # Cross-built on the x64 runner: after-pack.js skips the packaged smoke when the
          # build arch differs from the host arch, so this row proves packaging and version only.
          - target: win32-arm64
            platform: win32
            runner: windows-latest
            builder_flags: --win nsis zip --arm64
            node_options: ""
          - target: linux-x64
            platform: linux
            runner: ubuntu-22.04
            builder_flags: --linux --x64
            node_options: ""
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        shell: bash
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the tag still resolves to the built commit
        shell: bash
        run: |
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          node scripts/desktop-release/release-ci.mjs verify-tag --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"

      - name: Declare signing policy and require owned identities
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            darwin)
              # All five secrets: signed and notarized with fork-owned identities. None: unsigned by
              # documented policy (docs/release.md). A partial set fails so a half-configured
              # Apple account cannot silently ship an unsigned build.
              present=0
              missing=()
              for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                has="HAS_${name}"
                if [[ "${!has}" == "true" ]]; then
                  present=$((present + 1))
                else
                  missing+=("$name")
                fi
              done
              if (( present == 5 )); then
                echo "SIGNING_POLICY=notarized" >> "$GITHUB_ENV"
              elif (( present == 0 )); then
                echo "SIGNING_POLICY=unsigned" >> "$GITHUB_ENV"
                # Keep the arm64 ad-hoc signature (identity unset, never null) and drop what only
                # notarization needs: hardened runtime rejects ad-hoc libraries at launch.
                echo "BUILDER_SIGNING_FLAGS=-c.mac.notarize=false -c.mac.hardenedRuntime=false" >> "$GITHUB_ENV"
                echo "::notice::macOS build is unsigned by documented policy (no APPLE_* secrets)."
              else
                echo "::error::macOS signing and notarization need all of the repository secrets or none; missing: ${missing[*]}"
                exit 1
              fi
              ;;
            win32)
              # Windows installers stay unsigned (documented in docs/release.md) unless an owned
              # code-signing certificate is configured.
              if [[ "$HAS_WINDOWS_CSC_LINK" == "true" ]]; then
                echo "SIGNING_POLICY=signed" >> "$GITHUB_ENV"
              else
                echo "SIGNING_POLICY=unsigned" >> "$GITHUB_ENV"
                echo "::notice::Windows build is unsigned by documented policy (no WINDOWS_CSC_LINK)."
              fi
              ;;
            *)
              echo "SIGNING_POLICY=none" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Stamp the tag version into the desktop package
        shell: bash
        run: node scripts/desktop-release/release-ci.mjs set-version --tag "$RELEASE_TAG"

      - name: Install Linux smoke display
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth rpm

      - name: Build and smoke desktop release
        shell: bash
        env:
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          NODE_OPTIONS: ${{ matrix.node_options }}
          # macOS: fork-owned Developer ID certificate and notarization credentials.
          # Windows: optional fork-owned certificate; empty means the documented unsigned policy.
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.APPLE_CERTIFICATE || matrix.platform == 'win32' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_CERTIFICATE_PASSWORD || matrix.platform == 'win32' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'linux' && 'false' || '' }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          # An absent secret arrives as an empty string, and electron-builder resolves an empty
          # CSC_LINK against the project directory ("packages/desktop not a file"). Unsigned
          # policies must leave the signing variables unset.
          for name in CSC_LINK CSC_KEY_PASSWORD CSC_IDENTITY_AUTO_DISCOVERY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then unset "$name"; fi
          done
          # Publishing is never done by the builder. Each target writes its own output directory
          # so Windows x64 and arm64 cannot overwrite each other's latest.yml.
          # BUILDER_SIGNING_FLAGS is set by the signing policy step and left unquoted on purpose so
          # it splits into separate flags. It is empty for every policy except macOS unsigned.
          npm run build:desktop -- --publish never ${{ matrix.builder_flags }} \
            "-c.directories.output=release/${{ matrix.target }}" \
            "-c.publish.channel=${{ needs.preflight.outputs.builder_channel }}" \
            ${BUILDER_SIGNING_FLAGS:-}

      - name: Upload packaged smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Verify the packaged app version
        shell: bash
        run: node scripts/desktop-release/release-ci.mjs verify-packaged --tag "$RELEASE_TAG" --dir "packages/desktop/release/${{ matrix.target }}"

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'darwin' && env.SIGNING_POLICY == 'notarized'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="$(find "packages/desktop/release/${{ matrix.target }}" -maxdepth 2 -name Zekoder.app -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -Fx "TeamIdentifier=${APPLE_TEAM_ID}" "$RUNNER_TEMP/codesign.txt"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Verify Windows signing policy
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find "packages/desktop/release/${{ matrix.target }}" -maxdepth 1 -name 'Zekoder-Setup-*.exe' -print -quit)"
          test -n "$installer"
          status="$(powershell -NoProfile -Command "(Get-AuthenticodeSignature -LiteralPath '$installer').Status")"
          echo "Authenticode status: $status (policy: $SIGNING_POLICY)"
          if [[ "$SIGNING_POLICY" == "signed" && "$status" != "Valid" ]]; then
            echo "::error::Windows signing is configured but the installer signature is $status"
            exit 1
          fi

      - name: Collect build outputs and provenance
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/upload/${{ matrix.target }}"
          mkdir -p "$out"
          find "packages/desktop/release/${{ matrix.target }}" -maxdepth 1 -type f ! -name 'builder-*' -exec cp {} "$out/" \;
          node scripts/desktop-release/release-ci.mjs provenance --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --dir "$out" --target "${{ matrix.target }}" --signing "$SIGNING_POLICY" --runner "${{ matrix.runner }}"
          ls -l "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-build-${{ matrix.target }}
          path: ${{ runner.temp }}/upload/${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    needs: [preflight, release-notes, build]
    if: ${{ needs.preflight.outputs.already_published != 'true' }}
    # Cloud identity only. Nothing here can modify GitHub Releases; finalize does that after the
    # catalog is visible.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      PUBLISHED_AT: ${{ needs.preflight.outputs.published_at }}
      ZEKODER_RELEASE_BUCKET: ${{ vars.ZEKODER_RELEASE_BUCKET }}
    steps:
      - name: Require GCP configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${ZEKODER_RELEASE_BUCKET:-}" ]] || missing+=(ZEKODER_RELEASE_BUCKET)
          [[ -n "$WORKLOAD_IDENTITY_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$SERVICE_ACCOUNT" ]] || missing+=(GCP_SERVICE_ACCOUNT)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository variables: ${missing[*]}. See docs/release.md."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install release tooling dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --include-workspace-root --workspace=@getpaseo/protocol

      - name: Verify the tag still resolves to the built commit
        run: |
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          node scripts/desktop-release/release-ci.mjs verify-tag --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-build-*
          path: artifacts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-release-notes
          path: release-notes

      - name: Prepare the immutable release snapshot
        run: |
          set -euo pipefail
          mkdir build-input
          for dir in artifacts/desktop-build-*; do
            mv "$dir" "build-input/${dir#artifacts/desktop-build-}"
          done
          ls build-input
          node scripts/desktop-release/prepare-release.mjs \
            --tag "$RELEASE_TAG" \
            --input build-input \
            --output release-snapshot \
            --repo "${{ github.repository }}" \
            --published-at "$PUBLISHED_AT" \
            --source-commit "$SOURCE_SHA" \
            --release-json release-notes/release.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release-snapshot
          path: release-snapshot
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@b7593ed2efd1c1617e1b0254da33b86225adb2a5 # v2.1.12
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_write
          create_credentials_file: false

      # Uploads missing immutable objects with generation=0, reuses byte-identical ones, reads
      # every object back, and only then updates desktop/releases/manifest.json by
      # compare-and-swap. A catalog conflict reloads and merges instead of overwriting.
      - name: Publish to GCS
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node scripts/desktop-release/publish-release.mjs \
            --candidate release-snapshot/catalog-candidate.json \
            --release-root release-snapshot | tee "$RUNNER_TEMP/publish-result.json"
          {
            echo "## Desktop release published"
            echo ""
            echo "Tag: \`$RELEASE_TAG\` (commit \`$SOURCE_SHA\`)"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/publish-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    needs: [preflight, publish]
    # Also runs when preflight found the tag already published, so an interrupted finalization
    # is retried without rebuilding anything.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.publish.result == 'success' || needs.preflight.outputs.already_published == 'true') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install release tooling dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --include-workspace-root --workspace=@getpaseo/protocol

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZEKODER_RELEASE_BUCKET: ${{ vars.ZEKODER_RELEASE_BUCKET }}
        run: node scripts/desktop-release/release-ci.mjs finalize --tag "${{ needs.preflight.outputs.tag }}" --sha "${{ needs.preflight.outputs.source_sha }}" --repo "${{ github.repository }}"
