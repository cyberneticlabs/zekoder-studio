npmRebuild: false
appId: net.zekoder.desktop
productName: Zekoder
executableName: Zekoder
# electron-builder derives app-update.yml's updaterCacheDirName from the packaged package.json
# name, not productName. Without this override it is '@getpaseodesktop-updater', the same cache
# directory as upstream Paseo, so both installs would share one electron-updater download cache.
# Electron's default userData directory follows app.setName() (main.ts calls it before anything
# reads userData) and the Linux CLI/desktop names are pinned explicitly, so this does not move
# user data. The deb/rpm package name below is pinned to what the old '@'-scoped name resolved to.
extraMetadata:
  name: zekoder-desktop
copyright: "Copyright © 2024-2026 Cybernetic Labs Ltd · zekoder.com · cyberneticlabs.io"
protocols:
  - name: Zekoder agent link
    schemes:
      - zekoder
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  - "!node_modules/@getpaseo/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
# Bootstrap location of the Zekoder desktop release area. Builds never publish from here
# (release CI runs electron-builder with --publish never and the release pipeline uploads
# immutable per-target snapshots); the packaged app-update.yml records this root so clients can
# locate the catalog, never a mutable channel directory or the upstream GitHub repository.
# CI passes -c.publish.channel=latest|beta to name the feed files.
publish:
  provider: generic
  url: https://storage.googleapis.com/zekoder-releases/desktop/releases/
mac:
  artifactName: "Zekoder-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Zekoder-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Zekoder"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon.png
      to: icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  packageName: Zekoder
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  packageName: Zekoder
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Zekoder"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/paseo CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Zekoder-${arch}.${ext}"
win:
  artifactName: "Zekoder-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
